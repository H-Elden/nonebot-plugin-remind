# push / PR 全量回归：lint 与类型检查跑一次，测试跑 Python 3.10/3.11/3.12 矩阵
name: test

on:
  push:
  pull_request:

jobs:
  lint:
    name: lint (ruff + pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      # uv sync 默认包含 [dependency-groups].dev（pytest / nonebug 等）
      - run: uv sync --locked
      - run: uv run pytest
