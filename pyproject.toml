[project]
name = "nonebot-plugin-remind"
version = "0.2.0"
description = "nonebot2插件：提供符合中国宝宝体质的定时提醒功能~"
authors = [{ name = "Elden", email = "h_elden@qq.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "nonebot",
  "nonebot2",
  "reminder",
  "提醒",
  "定时提醒",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "nonebot2>=2.3.0,<3.0.0",
  "nonebot-plugin-localstore>=0.7.3,<0.8.0",
  "nonebot-adapter-onebot>=2.4.6,<3.0.0",
  "nonebot-plugin-apscheduler>=0.5.0,<0.6.0",
  "zhipuai>=2.1.5,<2.2.0",
  "jsonpickle>=4.0.2,<4.1.0",
  "jionlp>=1.5.16",
]

[project.urls]
Homepage = "https://github.com/H-Elden/nonebot-plugin-remind"
Issues = "https://github.com/H-Elden/nonebot-plugin-remind/issues"
Repository = "https://github.com/H-Elden/nonebot-plugin-remind.git"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
]

[tool.nonebot]
# 声明本插件（供 nb-cli / nonebot.load_from_toml 加载，例如本地加载测试）
plugins = ["nonebot_plugin_remind"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
